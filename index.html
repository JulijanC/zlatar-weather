<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zlatar Weather Station</title>
  <style>
    :root {

      --card: #e9eef0;

    }
    * { box-sizing: border-box; }
    body {

      min-height: 100vh;
      padding: clamp(12px, 3vw, 34px);
      color: var(--text);
      background:

      font-family: Arial, Helvetica, sans-serif;

    .dashboard { width: min(1120px, 100%); margin: 0 auto; }

    .subtitle { color: var(--muted); font-size: 12px; letter-spacing: .5px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .tag {
      border: 1px solid #527080; border-radius: 5px; padding: 3px 7px;
      color: #c5d5dc; font-size: 10px; letter-spacing: .4px;

    .tag.online { color: var(--good); border-color: #3e9e8d; }
    .clock { text-align: right; flex: 0 0 auto; }
    .date { color: #c5d2d9; font-size: 15px; text-transform: lowercase; }
    .time { font-size: clamp(28px, 5vw, 48px); font-weight: 700; letter-spacing: 1px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .sensor { min-width: 0; border: 1px solid #416475; border-radius: 9px; overflow: hidden; background: #142532; }
    .sensor-title {

    }

    .thermo { font-size: 22px; margin-top: 8px; color: #81949d; }
    .unit { font-size: 20px; font-weight: 400; margin: 5px 0 0 1px; }
    .humidity { border-left: 1px solid #c5d0d4; padding-left: 17px; }
    .humidity-value { font-size: 22px; font-weight: 700; white-space: nowrap; }
    .drop { color: #77aab5; margin-right: 4px; }
    .percent { font-size: 12px; font-weight: 400; color: #586c76; }
    .bar { height: 8px; margin-top: 8px; border-radius: 10px; background: #cbd6d8; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, #2bc8c0, #67d2ae); transition: width .3s; }
    .sensor-foot { padding: 7px 13px; color: #71848d; font-size: 12px; background: #e5ebed; }
    .sensor-foot strong { color: #4c897d; font-weight: 600; }

    .section-title { padding: 9px 13px; font-size: 19px; font-weight: 700; background: linear-gradient(90deg, #1d3545, #142532); border-bottom: 1px solid var(--line); }
    .forecast-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; padding: 10px; background: #142532; }
    .forecast-card { color: var(--card-text); background: #e5ecee; border-radius: 7px; overflow: hidden; min-width: 0; }
    .forecast-heading { padding: 7px 10px; color: #f2f7f8; background: #496574; font-weight: 700; }
    .forecast-content { padding: 10px; min-height: 105px; display: flex; gap: 12px; align-items: flex-start; }
    .weather-icon { font-size: 34px; }
    .forecast-details { font-size: 12px; line-height: 1.8; }
    .forecast-details strong { font-size: 14px; }
    .description { margin-top: 4px; font-size: 11px; color: #526772; }
    .forecast-foot { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-top: 1px solid #cbd5d8; font-size: 10px; color: #61747d; }
